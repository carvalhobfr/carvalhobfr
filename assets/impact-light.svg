<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t d">
<title id="t">TVI Player since joining Media Capital in Nov 2021: Hundreds of thousands monthly users to 2M+ monthly unique users</title>
<desc id="d">Joined Media Capital in Nov 2021. TVI Player: Dec 2022, Hundreds of thousands monthly users. 2024, ~1M monthly unique users. May 2025, 2M+ monthly unique users. Context, Media Capital Digital ecosystem: 4M+ monthly unique users, 2.5B pageviews in 2025. Product and ecosystem metrics published by Media Capital. They describe the product and the group, not individual results. The earliest public TVI Player figure is from Dec 2022.</desc>
