<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-labelledby="t d">
<title id="t">Engineering impact: 2M+ monthly unique users on TVI Player</title>
<desc id="d">TVI Player (Media Capital) reached 2M+ monthly unique users in May 2025. Dec 2022: Hundreds of thousands monthly users. 2024: ~1M monthly unique users. May 2025: 2M+ monthly unique users. Context, Media Capital Digital ecosystem: 4M+ monthly unique users, 2.5B pageviews in 2025. Product and ecosystem metrics published by Media Capital. Not individual results.</desc>
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style>
<defs></defs>
<rect x="0.75" y="0.75" width="718.5" height="422.5" rx="16" fill="#0a0a0a" stroke="#3f3f46" stroke-width="1.5"/>

<text x="40" y="46" class="mono" font-size="16" font-weight="400" fill="#8b8b95" letter-spacing="1.5">ENGINEERING IMPACT</text>
<text x="680" y="46" class="mono" font-size="16" font-weight="400" fill="#8b8b95" text-anchor="end" letter-spacing="1">TVI PLAYER · MEDIA CAPITAL</text>
<text x="34" y="172" class="sans" font-size="120" font-weight="700" fill="#fafafa" textLength="236" lengthAdjust="spacingAndGlyphs">2M+</text>
<text x="300" y="120" class="sans" font-size="28" font-weight="600" fill="#fafafa" textLength="260" lengthAdjust="spacingAndGlyphs">monthly unique users</text>
<text x="300" y="150" class="sans" font-size="20" font-weight="400" fill="#a1a1aa">TVI Player · May 2025</text>
<text x="300" y="178" class="sans" font-size="18" font-weight="400" fill="#a1a1aa" textLength="372" lengthAdjust="spacingAndGlyphs">A product metric, not an individual result.</text>
<line x1="48" y1="232" x2="672" y2="232" stroke="#8b8b95" stroke-width="1.5"/>
<circle cx="48" cy="232" r="6" fill="#0a0a0a" stroke="#a1a1aa" stroke-width="2"/>
<text x="40" y="264" class="mono" font-size="17" font-weight="400" fill="#8b8b95" text-anchor="start">Dec 2022</text>
<text x="40" y="290" class="sans" font-size="20" font-weight="700" fill="#fafafa" text-anchor="start">Hundreds of thousands</text>
<text x="40" y="314" class="sans" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="start">monthly users</text>
<circle cx="360" cy="232" r="6" fill="#0a0a0a" stroke="#a1a1aa" stroke-width="2"/>
<text x="360" y="264" class="mono" font-size="17" font-weight="400" fill="#8b8b95" text-anchor="middle">2024</text>
<text x="360" y="290" class="sans" font-size="20" font-weight="700" fill="#fafafa" text-anchor="middle">~1M</text>
<text x="360" y="314" class="sans" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="middle">monthly unique users</text>
<circle cx="672" cy="232" r="8" fill="#fafafa" stroke="#fafafa" stroke-width="2"/>
<text x="680" y="264" class="mono" font-size="17" font-weight="400" fill="#8b8b95" text-anchor="end">May 2025</text>
<text x="680" y="290" class="sans" font-size="20" font-weight="700" fill="#fafafa" text-anchor="end">2M+</text>
<text x="680" y="314" class="sans" font-size="17" font-weight="400" fill="#a1a1aa" text-anchor="end">monthly unique users</text>
<line x1="40" y1="338" x2="680" y2="338" stroke="#3f3f46"/>
<text x="40" y="364" class="mono" font-size="16" font-weight="400" fill="#8b8b95" letter-spacing="1">MEDIA CAPITAL DIGITAL ECOSYSTEM · CONTEXT</text>
<text x="40" y="392" class="sans" fill="#fafafa"><tspan font-size="24" font-weight="700">4M+</tspan><tspan dx="10" font-size="18" font-weight="400" fill="#a1a1aa">monthly unique users</tspan></text>
<text x="360" y="392" class="sans" fill="#fafafa"><tspan font-size="24" font-weight="700">2.5B</tspan><tspan dx="10" font-size="18" font-weight="400" fill="#a1a1aa">pageviews in 2025</tspan></text>
</svg>
